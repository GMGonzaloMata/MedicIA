name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Claude Code y Codex leen copias separadas de estas skills, que deben seguir iguales.
      - name: Comprobar que las skills propias estén sincronizadas
        run: |
          diff -r .claude/skills/simple-task .agents/skills/simple-task
          diff -r .claude/skills/review-changes .agents/skills/review-changes
      - run: npm run check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
