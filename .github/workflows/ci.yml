name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Las pruebas de integración necesitan una base de PostgreSQL real.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medicia
          POSTGRES_PASSWORD: medicia
          POSTGRES_DB: medicia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medicia -d medicia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medicia:medicia@localhost:5432/medicia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Los modelos se desarrollan fuera de este repositorio y sus artefactos viven en el bucket de artefactos de
      # infra/. Corre en toda propuesta, no solo en las que tocan infra/. (FR-005 de la funcionalidad 004.)
      - name: Comprobar que no haya artefactos de modelos versionados
        run: |
          artefactos=$(git -c core.quotePath=false ls-files | grep -E '\.(pt|pth|onnx|safetensors|h5|ckpt|joblib|pkl|pickle|tgz|tar\.gz|tflite|gguf|keras|mar|npy|npz|parquet|ecg1)$' || true)
          if [ -n "$artefactos" ]; then
            echo "::error::Hay artefactos de modelos o arreglos de datos versionados (FR-005 de la 004, FR-022 de la 005). Los modelos van al bucket de artefactos y los datos nunca a git:"
            echo "$artefactos"
            exit 1
          fi
          datos=$(git -c core.quotePath=false ls-files | grep -iE '(^|/)echonext[^/]*\.(csv|npy|npz|parquet|xml|zip)$' || true)
          if [ -n "$datos" ]; then
            echo "::error::Hay archivos del conjunto de datos EchoNext versionados (FR-022 de la 005):"
            echo "$datos"
            exit 1
          fi
      # Claude Code y Codex leen copias separadas de estas skills, que deben seguir iguales.
      - name: Comprobar que las skills propias estén sincronizadas
        run: |
          diff -r .claude/skills/simple-task .agents/skills/simple-task
          diff -r .claude/skills/review-changes .agents/skills/review-changes
      # Prisma no lee la base al generar el cliente, pero su configuración exige DATABASE_URL.
      - name: Generar el cliente de Prisma y aplicar las migraciones
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - run: npm run check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    # Las pruebas E2E preparan y alteran datos en la base (clínicas, vínculos, sesiones).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medicia
          POSTGRES_PASSWORD: medicia
          POSTGRES_DB: medicia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medicia -d medicia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medicia:medicia@localhost:5432/medicia
      # Proveedor de identidad simulado: ninguna prueba usa AWS.
      IDENTITY_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generar el cliente de Prisma y aplicar las migraciones
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
