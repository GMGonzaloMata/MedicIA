name: Infraestructura

# Comprobaciones de infra/. Ningún paso aplica cambios a AWS (FR-018): el plan solo lee.
# Contrato: specs/003-infra-base-cognito/contracts/ci-and-access.md

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/**"

permissions:
  contents: read

# El plan no modifica nada, así que la ejecución nueva cancela la anterior de la misma rama.
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.1"

jobs:
  static:
    name: Comprobaciones estáticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Formato
        run: terraform fmt -check -recursive infra

      - name: Inicializar y validar cada raíz y módulo
        run: |
          for dir in infra/bootstrap infra/environments/dev infra/modules/identity infra/modules/model-artifacts infra/modules/sagemaker-execution-role infra/modules/model-endpoints; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6

      - name: tflint
        working-directory: infra
        env:
          # Evita el límite de consultas anónimas de la API de GitHub al descargar el complemento.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          for dir in bootstrap environments/dev modules/identity modules/model-artifacts modules/sagemaker-execution-role modules/model-endpoints; do
            echo "::group::$dir"
            tflint --config="$PWD/.tflint.hcl" --chdir="$dir"
            echo "::endgroup::"
          done

      - name: Pruebas de Terraform
        run: |
          for dir in infra/bootstrap infra/environments/dev infra/modules/identity infra/modules/model-artifacts infra/modules/sagemaker-execution-role infra/modules/model-endpoints; do
            echo "::group::$dir"
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

      - name: Análisis de configuración (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: infra/.trivyignore

      - name: Búsqueda de secretos (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          scan-ref: infra
          exit-code: "1"
          trivyignores: infra/.trivyignore

      # Los patrones usan clases de caracteres, como [A] o [-], para que este archivo no los encuentre a sí mismo.
      - name: Archivos prohibidos y secretos en el contenido versionado
        run: |
          fallo=0

          prohibidos=$(git ls-files -- infra .github | grep -E '(\.tfstate($|\.)|\.tfplan$|\.tfvars(\.json)?$|(^|/)\.terraform/)' || true)
          if [ -n "$prohibidos" ]; then
            echo "::error::Hay archivos de estado, de plan o de variables versionados:"
            echo "$prohibidos"
            fallo=1
          fi

          # Los artefactos de modelos (pesos) viven en el bucket de artefactos, nunca en el repositorio (FR-005).
          # Se revisa todo el repositorio, no solo infra: un modelo podría subirse desde cualquier carpeta.
          # Este paso solo corre si la propuesta toca infra/; la misma comprobación está en ci.yml, que corre siempre.
          artefactos=$(git ls-files | grep -E '\.(pt|pth|onnx|safetensors|h5|ckpt|joblib|pkl|pickle|tgz|tar\.gz|tflite|gguf|keras|mar)$' || true)
          if [ -n "$artefactos" ]; then
            echo "::error::Hay artefactos de modelos versionados (FR-005):"
            echo "$artefactos"
            fallo=1
          fi

          if git grep -nE '[A]KIA[0-9A-Z]{16}' -- infra .github; then
            echo "::error::Hay un identificador de clave de acceso de AWS en el contenido versionado."
            fallo=1
          fi

          if git grep -nE '[-]{5}BEGIN [A-Z ]*PRIVATE KEY' -- infra .github; then
            echo "::error::Hay una clave privada en el contenido versionado."
            fallo=1
          fi

          exit "$fallo"

      - name: Cada raíz tiene su archivo de bloqueo versionado
        run: |
          fallo=0
          for dir in infra/bootstrap infra/environments/dev infra/modules/identity infra/modules/model-artifacts infra/modules/sagemaker-execution-role infra/modules/model-endpoints; do
            if ! git ls-files --error-unmatch "$dir/.terraform.lock.hcl" >/dev/null 2>&1; then
              echo "::error::Falta versionar $dir/.terraform.lock.hcl"
              fallo=1
            fi
          done
          exit "$fallo"

      - name: Guarda del contrato del grupo de usuarios
        run: |
          fallo=0
          if git grep -nE '^[[:space:]]*resource[[:space:]]+"aws_cognito_user_pool_domain"' -- 'infra/*.tf'; then
            echo "::error::El contrato de la funcionalidad 002 no admite dominio en el grupo de usuarios."
            fallo=1
          fi
          if git grep -nE '^[[:space:]]*resource[[:space:]]+"aws_cognito_identity_provider"' -- 'infra/*.tf'; then
            echo "::error::El contrato de la funcionalidad 002 no admite proveedores de identidad externos."
            fallo=1
          fi
          clientes=$(git grep -hE '^[[:space:]]*resource[[:space:]]+"aws_cognito_user_pool_client"' -- 'infra/*.tf' | wc -l)
          if [ "$clientes" -gt 1 ]; then
            echo "::error::El contrato admite un único cliente de aplicación y hay $clientes."
            fallo=1
          fi
          exit "$fallo"

      # Protege el costo de la base de SageMaker. La guarda de etiquetas de más abajo, que mira providers.tf,
      # también cubre FR-016: las etiquetas de los recursos nuevos vienen de default_tags.
      - name: Guarda de costo (FR-012, FR-013)
        run: |
          fallo=0

          # El punto de inferencia es lo único que cobra por hora y solo se crea dentro de su módulo, con enabled.
          if git grep -lE '^[[:space:]]*resource[[:space:]]+"aws_sagemaker_endpoint"' -- 'infra/*.tf' ':!infra/modules/model-endpoints/*'; then
            echo "::error::Un punto de inferencia de SageMaker solo puede declararse en infra/modules/model-endpoints."
            fallo=1
          fi

          # Recursos que cobran por tiempo de uso y están fuera del alcance de esta base.
          if git grep -nE '^[[:space:]]*resource[[:space:]]+"aws_sagemaker_(notebook_instance|domain|user_profile|space|app)"' -- 'infra/*.tf'; then
            echo "::error::Cuadernos, dominios, perfiles, espacios y aplicaciones de SageMaker cobran por tiempo y están fuera de alcance."
            fallo=1
          fi

          # GPU y aceleradores son una decisión de costo aparte: se agregan con su precio documentado.
          if git grep -nE '"ml\.(p[0-9]|g[0-9]|trn|inf|dl)' -- 'infra/*.tf'; then
            echo "::error::Los tipos de instancia con GPU o aceleradores no están permitidos: solo CPU."
            fallo=1
          fi

          # terraform test no ve el ciclo de vida, así que se comprueba acá que el bucket siga protegido (FR-003).
          # Se exige la línea sin comentar: una línea con # delante no protege nada.
          if ! grep -qE '^[[:space:]]*prevent_destroy[[:space:]]*=[[:space:]]*true' infra/modules/model-artifacts/main.tf; then
            echo "::error::El bucket de artefactos debe conservar prevent_destroy = true (FR-003)."
            fallo=1
          fi

          exit "$fallo"

      - name: Guarda de no aplicar (FR-018)
        run: |
          # Admite opciones entre terraform y el subcomando, como -chdir=..., y los archivos .yml y .yaml.
          # Cubre también subcomandos que escriben el estado. No detecta un comando partido en dos líneas.
          if grep -rnE --include='*.yml' --include='*.yaml' 'terraform([[:space:]]+-[^[:space:]]+)*[[:space:]]+(apply|destroy|import|state|force-unlock|refresh|taint|untaint|workspace[[:space:]]+(new|delete))([[:space:]]|$)' .github/workflows; then
            echo "::error::Los flujos no pueden aplicar, destruir, importar ni tocar el estado."
            exit 1
          fi

      - name: Guarda de etiquetas (FR-016)
        run: |
          fallo=0
          for archivo in infra/bootstrap/providers.tf infra/environments/dev/providers.tf; do
            for clave in default_tags Project Environment ManagedBy; do
              # Se busca dentro del bloque default_tags, no en cualquier parte del archivo.
              if ! grep -A8 default_tags "$archivo" | grep -q "$clave"; then
                echo "::error::$archivo no declara $clave en default_tags."
                fallo=1
              fi
            done
          done
          exit "$fallo"

  plan:
    name: Plan de solo lectura
    needs: static
    # Una propuesta desde un fork no recibe credenciales. En main no corre: allí solo van las comprobaciones estáticas.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Muestra el sujeto que GitHub enviará a AWS, antes de asumir el rol, para poder
      # compararlo con github_oidc_subject si la confianza lo rechaza (R10). No imprime el token.
      - name: Mostrar el sujeto del token
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$token"
          echo "$token" | jq -R 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | {sub, aud, iss}'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.INFRA_PLAN_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Inicializar el entorno de desarrollo
        run: terraform -chdir=infra/environments/dev init -input=false

      # Sin bloqueo: el plan solo lee y no debe competir con quien aplica. El rol no podría escribir el bloqueo.
      - name: Plan
        run: |
          set -o pipefail
          terraform -chdir=infra/environments/dev plan -lock=false -input=false -no-color | tee "$RUNNER_TEMP/plan.txt"

      - name: Volcar el plan al resumen
        if: always()
        run: |
          {
            echo "## Plan de infra/environments/dev"
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan.txt" 2>/dev/null || echo "No se generó un plan."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
